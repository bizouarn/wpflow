name: Site de documentation

# Construit demo/docs-site (Blazor WebAssembly, entièrement statique) et le publie sur GitHub Pages.
# Réglage à faire une fois dans le dépôt : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
    # Seulement ce qui change le site.
    paths:
      - 'demo/docs-site/**'
      - 'doc/**'
      - 'src/Wpflow.Core/**'
      - 'src/Wpflow.Blazor/**'
      - 'assets/logo.svg'
      - 'work-doc/screenshots/demo.png'
      - 'Directory.Build.props'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Une publication à la fois ; celle en cours va à son terme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Donne le chemin du site : « /wpflow », ou vide avec un domaine personnalisé.
      - name: Configuration de Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # La publication écrit aussi le base href, 404.html et .nojekyll (voir docs-site.csproj).
      - name: Publication du site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: dotnet publish demo/docs-site -c Release -p:SiteBaseHref="$BASE_PATH/" -o publish

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    # Uniquement depuis main, y compris pour un lancement manuel.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publier sur Pages
      id-token: write   # jeton OIDC vérifié par deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
