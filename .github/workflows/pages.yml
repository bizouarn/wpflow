name: Site de documentation

# Construit demo/docs-site (Blazor WebAssembly, entièrement statique) et le publie sur GitHub Pages.
# Réglage à faire une fois dans le dépôt : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
    # Seulement ce qui change le site.
    paths:
      - 'demo/docs-site/**'
      - 'doc/**'
      - 'src/Wpflow.Core/**'
      - 'src/Wpflow.Blazor/**'
      - 'assets/logo.svg'
      - 'work-doc/screenshots/demo.png'
      - 'Directory.Build.props'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Une publication à la fois ; celle en cours va à son terme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Donne le chemin du site : « /wpflow », ou vide avec un domaine personnalisé.
      - name: Configuration de Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # La publication écrit aussi le base href, 404.html et .nojekyll (voir docs-site.csproj).
      - name: Publication du site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: dotnet publish demo/docs-site -c Release -p:SiteBaseHref="$BASE_PATH/" -o publish

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    # Uniquement depuis main, y compris pour un lancement manuel.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publier sur Pages
      id-token: write   # jeton OIDC vérifié par deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
