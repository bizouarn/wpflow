name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # WPF et les tests WPF (net10.0-windows) demandent Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore wpflow.sln

      - name: Build
        run: dotnet build wpflow.sln -c Release --no-restore

      # Les auto-tests à la vraie souris (WPFLOW_SELFTEST, WPFLOW_EXAMPLES) ne tournent pas ici : pas de bureau interactif.
      - name: Tests du noyau
        run: dotnet test tests/Wpflow.Core.Tests -c Release --no-build

      - name: Tests WPF
        run: dotnet test tests/Wpflow.Wpf.Tests -c Release --no-build

      - name: Tests Blazor
        run: dotnet test tests/Wpflow.Blazor.Tests -c Release --no-build

      # Démo lancée en vrai (Server et WebAssembly) et pilotée dans le Chrome du runner : le pont JS de bout en bout.
      - name: Tests Blazor de bout en bout (Chrome)
        timeout-minutes: 15
        run: dotnet test tests/Wpflow.Blazor.E2E -c Release --no-build

      - name: Pack (vérification)
        run: |
          dotnet pack src/Wpflow.Wpf -c Release --no-build -o artifacts
          dotnet pack src/Wpflow.Blazor -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
