name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # WPF et les tests WPF (net10.0-windows) demandent Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore wpflow.sln

      - name: Build
        run: dotnet build wpflow.sln -c Release --no-restore

      - name: Tests du noyau
        run: dotnet test tests/Wpflow.Core.Tests -c Release --no-build

      - name: Tests WPF
        run: dotnet test tests/Wpflow.Wpf.Tests -c Release --no-build

      - name: Tests Blazor
        run: dotnet test tests/Wpflow.Blazor.Tests -c Release --no-build

      # Démo lancée en vrai (Server et WebAssembly) et pilotée dans le Chrome du runner : le pont JS de bout en bout.
      - name: Tests Blazor de bout en bout (Chrome)
        timeout-minutes: 40
        run: dotnet test tests/Wpflow.Blazor.E2E -c Release --no-build

      # Avec la validation de paquet : une API retirée par rapport à la version publiée fait échouer cette étape.
      - name: Pack (vérification)
        run: |
          dotnet pack src/Wpflow.Core -c Release --no-build -o artifacts
          dotnet pack src/Wpflow.Wpf -c Release --no-build -o artifacts
          dotnet pack src/Wpflow.Blazor -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  # Les paquets de ce commit, installés dans des applications neuves hors de la solution (aucune référence de projet).
  consumers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Consommer les paquets
        timeout-minutes: 25
        shell: pwsh
        run: ./tests/consumers/run.ps1

  # Vraie souris et vrai clavier Win32 : demande un bureau interactif sur le runner.
  selftests-wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Auto-tests WPF
        timeout-minutes: 30
        shell: pwsh
        run: ./tests/run-wpf-selftests.ps1 -Configuration Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftests-wpf
          path: artifacts/selftest
