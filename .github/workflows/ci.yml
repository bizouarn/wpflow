name: CI

# Seulement les tests de base (noyau, WPF, bUnit). Les tests lents se lancent en local avant une version :
#   dotnet test tests/Wpflow.Blazor.E2E          (Chrome, environ 22 min)
#   powershell -File tests/run-wpf-selftests.ps1 (vraie souris, environ 15 min)
#   powershell -File tests/consumers/run.ps1     (paquets installés dans des applications neuves)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # WPF et les tests WPF (net10.0-windows) demandent Windows.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore wpflow.sln

      - name: Build
        run: dotnet build wpflow.sln -c Release --no-restore

      - name: Tests de base
        timeout-minutes: 1
        shell: bash
        run: |
          for p in Core Wpf Blazor; do
            dotnet test "tests/Wpflow.$p.Tests" -c Release --no-build
          done

      # Avec la validation de paquet : une API retirée par rapport à la version publiée fait échouer cette étape.
      - name: Pack (vérification)
        run: |
          dotnet pack src/Wpflow.Core -c Release --no-build -o artifacts
          dotnet pack src/Wpflow.Wpf -c Release --no-build -o artifacts
          dotnet pack src/Wpflow.Blazor -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
