<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Documentation et exemples interactifs de wpflow, l'éditeur de graphes à nodes pour WPF et Blazor." />
    <!-- La ligne suivante est remplacée à la publication par SiteBaseHref (voir docs-site.csproj) : la garder telle quelle. -->
    <base href="/" />
    <title>wpflow · éditeur de graphes à nodes pour WPF et Blazor</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="_content/Wpflow.Blazor/wpflow.css" />
    <link rel="stylesheet" href="site.css" />
</head>
<body>
    <div id="app">
        <p class="loading">Chargement de wpflow…</p>
        <noscript><p class="loading">Ce site s'exécute dans le navigateur : activez JavaScript, ou lisez la <a href="https://github.com/bizouarn/wpflow/tree/main/doc">documentation sur GitHub</a>.</p></noscript>
    </div>
    <div id="blazor-error-ui">Une erreur est survenue. <a href="" onclick="location.reload(); return false;">Recharger la page</a></div>
    <script>
        window.wpsite = {
            // Blazor ne rejoint pas l'ancre d'une page rendue après coup : on le fait après le rendu.
            scrollTo(id) {
                const target = id ? document.getElementById(id) : null;
                if (target) target.scrollIntoView();
                else window.scrollTo(0, 0);
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
